# configs/config.toml
# NOTE: Root-level keys must appear BEFORE any [table] sections,
# otherwise TOML parses them as belonging to the last opened table.

default_client = "openai"
theme = "dark"
approval_mode = "manual"
max_subagents = 3

[models.openai]
api_key = "sk-494cb5ad2fd84e479e0438902b1755dc"
base_url = "http://localhost:8080/v1"
default_model = "deepseek-pro"

[models.deepseek]
api_key = ""
base_url = "https://api.deepseek.com"
default_model = "deepseek-chat"

[ui]
max_visible_lines = 8

# Example agent roles for the agent system
# When enabled, normal chat is automatically dispatched through the orchestrator.
# All tools operate inside sandbox_dir to protect your project code.
[[agent_role]]
name = "coder"
enabled = false  # set to true and configure tools to activate
model = ""
system_prompt = "You are a Go developer. Analyze requirements, write clean code, and review your work."
tools = ["read_file", "write_file", "search_text", "exec_command", "chat_llm"]
max_react_loop = 10
sandbox_dir = "/tmp/agent-tui/sandbox"  # all file operations restricted to this directory (outside project)
